name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Selecionar versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compilar e Criar Archive
        run: |
          xcodebuild archive \
            -project *.xcodeproj \
            -scheme $(xcodebuild -list -json | grep -A 1 '"schemes"' | tail -n 1 | tr -d ' "') \
            -archivePath build/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empacotar Payload (.IPA)
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload do IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/App.ipa
