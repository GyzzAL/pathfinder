name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Selecionar versão do Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Compilar o Archive
      run: |
        xcodebuild archive \
          -workspace SeuProjeto.xcworkspace \  # Ou -project SeuProjeto.xcodeproj
          -scheme SeuScheme \
          -archivePath build/SeuProjeto.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Gerar o ficheiro .IPA
      run: |
        mkdir -p build/Payload
        cp -r build/SeuProjeto.xcarchive/Products/Applications/*.app build/Payload/
        cd build
        zip -r SeuProjeto.ipa Payload

    - name: Upload do IPA como Artefacto
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: build/SeuProjeto.ipa
