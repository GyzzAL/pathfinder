name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: cd ios && pod install
      - run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme PathFinder -configuration Release -archivePath build/App.xcarchive CODE_SIGNING_ALLOWED=NO || true
          mkdir -p build/Payload
          APP=$(find build -name "*.app" | head -n 1)
          cp -R $APP build/Payload/
          cd build && zip -r App.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPA
          path: ios/build/App.ipa
