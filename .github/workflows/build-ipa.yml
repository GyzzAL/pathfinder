name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --legacy-peer-deps
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: cd ios && pod install
      - name: Build IPA
        run: |
          cd ios
          xcodebuild -workspace PathFinder.xcworkspace \
            -scheme PathFinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          mkdir -p build/Payload
          APP=$(find build/App.xcarchive -name "*.app" | head -n 1)
          echo "APP encontrado: $APP"
          cp -R "$APP" build/Payload/
          cd build && zip -r App.ipa Payload
          ls -lh
      - uses: actions/upload-artifact@v5
        with:
          name: IPA
          path: ios/build/App.ipa
