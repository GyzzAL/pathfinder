name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.19.0'
      - run: npm install --legacy-peer-deps
      
      - name: Fix bundle
        run: |
          npx expo prebuild --platform ios --clean --no-install
          cd ios && pod install
          cd ..
          # Testa se o bundle do JS funciona antes do Xcode
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle --assets-dest ios || npx react-native bundle --platform ios --dev false --entry-file App.js --bundle-output ios/main.jsbundle --assets-dest ios || echo "Tentando com App.tsx"
          ls -lh ios/main.jsbundle || true

      - name: Build IPA
        run: |
          cd ios
          xcodebuild -workspace PathFinder.xcworkspace \
            -scheme PathFinder \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -quiet
          mkdir -p build/Payload
          APP=$(find build/App.xcarchive -name "*.app" -type d | head -n 1)
          cp -R "$APP" build/Payload/
          cd build && zip -qr App.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: IPA
          path: ios/build/App.ipa
